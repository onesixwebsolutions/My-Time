name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/DayGrid.Web/package-lock.json

      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep --outdir "$RUNNER_TEMP/bicep"

      - name: npm ci
        working-directory: src/DayGrid.Web
        run: npm ci

      - name: Angular unit tests
        working-directory: src/DayGrid.Web
        run: npm run test:ci

      - name: dotnet restore
        run: dotnet restore DayGrid.sln

      - name: dotnet build
        run: dotnet build DayGrid.sln -c Release --no-restore

      - name: dotnet test
        run: >
          dotnet test DayGrid.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            src/DayGrid.Web/coverage
          if-no-files-found: ignore

      # node_modules already exists from `npm ci`, so the csproj's `npm install` is skipped;
      # the MSBuild target still runs the production `ng build` and copies it into wwwroot.
      - name: dotnet publish
        run: dotnet publish src/DayGrid.Api/DayGrid.Api.csproj -c Release -o ./publish

      - name: Verify SPA was bundled
        run: test -f ./publish/wwwroot/index.html

      - name: Upload publish artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ./publish
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Smoke test /health
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          url="${APP_URL%/}/health"
          echo "Probing $url"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Healthy after attempt $i:"; cat /tmp/health.json; echo
              exit 0
            fi
            echo "Attempt $i: HTTP $code - retrying in 15s"
            sleep 15
          done
          echo "::error::$url did not return 200 within ~5 minutes"
          exit 1
