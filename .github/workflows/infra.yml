name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      what-if:
        description: 'Preview changes only (what-if), do not deploy'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra-production
  cancel-in-progress: false

jobs:
  deploy-infra:
    name: Deploy infra/main.bicep
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Plain az CLI (preinstalled on the runner, session from azure/login) instead of
      # azure/arm-deploy so values containing spaces (e.g. Gmail app passwords
      # "abcd efgh ijkl mnop") are passed safely as separate quoted arguments.
      - name: Deploy Bicep
        id: arm
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.APP_NAME || 'daygrid' }}
          APP_SERVICE_SKU: ${{ vars.APP_SERVICE_SKU || 'B1' }}
          POSTGRES_ADMIN_LOGIN: ${{ vars.POSTGRES_ADMIN_LOGIN || 'daygridadmin' }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          EMAIL_USER: ${{ vars.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || 'DayGrid' }}
          APP_TIMEZONE: ${{ vars.APP_TIMEZONE || 'Asia/Kolkata' }}
          WHAT_IF: ${{ inputs.what-if }}
        run: |
          set -euo pipefail
          for v in RG EMAIL_USER POSTGRES_ADMIN_PASSWORD EMAIL_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set (see docs/DEPLOYMENT.md)"; exit 1; fi
          done

          params=(
            appName="$APP_NAME"
            appServiceSku="$APP_SERVICE_SKU"
            postgresAdminLogin="$POSTGRES_ADMIN_LOGIN"
            postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD"
            emailUser="$EMAIL_USER"
            emailPassword="$EMAIL_PASSWORD"
            emailFromName="$EMAIL_FROM_NAME"
            timeZone="$APP_TIMEZONE"
          )

          if [ "$WHAT_IF" = "true" ]; then
            az deployment group what-if --resource-group "$RG" --template-file infra/main.bicep --parameters "${params[@]}"
            exit 0
          fi

          outputs=$(az deployment group create --resource-group "$RG" --name "daygrid-${GITHUB_RUN_NUMBER}" --template-file infra/main.bicep --parameters "${params[@]}" --query properties.outputs -o json)

          echo "webAppName=$(jq -r .webAppName.value <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "defaultHostName=$(jq -r .defaultHostName.value <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "postgresFqdn=$(jq -r .postgresFqdn.value <<<"$outputs")" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: ${{ !inputs.what-if }}
        run: |
          {
            echo "## Infrastructure deployed"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| webAppName | \`${{ steps.arm.outputs.webAppName }}\` |"
            echo "| defaultHostName | https://${{ steps.arm.outputs.defaultHostName }} |"
            echo "| postgresFqdn | \`${{ steps.arm.outputs.postgresFqdn }}\` |"
            echo ""
            echo "Set the repository variable **AZURE_WEBAPP_NAME** to \`${{ steps.arm.outputs.webAppName }}\` (if not already set), then push to main to deploy the app."
          } >> "$GITHUB_STEP_SUMMARY"
