services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: daygrid
      POSTGRES_USER: daygrid
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - daygrid-db-data:/var/lib/postgresql/data
      # Applies the hand-written reference schema on first boot only (Postgres only runs
      # /docker-entrypoint-initdb.d scripts against an empty data directory). Once you have
      # the .NET SDK locally, prefer `dotnet ef database update` instead — see README.md.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Realistic sample data (checklists, timetable, future tasks, standalone Tasks) —
      # verified against this exact schema; see README.md "Verified with sample data".
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daygrid -d daygrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/DayGrid.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Database=daygrid;Username=daygrid;Password=dev"
      Email__Host: "${EMAIL_HOST:-smtp.gmail.com}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__UseStartTls: "true"
      Email__User: "${EMAIL_USER:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__FromName: "DayGrid"
      App__TimeZone: "Asia/Kolkata"
    ports:
      - "5080:8080"

  web:
    build:
      context: ./src/DayGrid.Web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  daygrid-db-data:
