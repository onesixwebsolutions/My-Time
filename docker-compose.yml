services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: daygrid
      POSTGRES_USER: daygrid
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - daygrid-db-data:/var/lib/postgresql/data
      # No SQL is mounted into /docker-entrypoint-initdb.d any more: the API applies the
      # versioned migrations in db/migrations at startup (Database__InitializeSchema below).
      # Sample data: once the API has started, `psql -f db/seed.sql` BEFORE registering the
      # first account (which then claims it) — see README.md.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daygrid -d daygrid"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/DayGrid.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Database=daygrid;Username=daygrid;Password=dev"
      Database__InitializeSchema: "true"
      # Links in account emails point at the web container.
      App__PublicBaseUrl: "${PUBLIC_BASE_URL:-http://localhost:4200}"
      # Smtp (default) or Pickup (.eml files inside the container under Email__PickupDirectory).
      Email__Mode: "${EMAIL_MODE:-Smtp}"
      Email__PickupDirectory: "/tmp/daygrid-mail"
      Email__Host: "${EMAIL_HOST:-smtp.gmail.com}"
      Email__Port: "${EMAIL_PORT:-587}"
      Email__UseStartTls: "true"
      Email__User: "${EMAIL_USER:-}"
      Email__Password: "${EMAIL_PASSWORD:-}"
      Email__FromName: "DayGrid"
      App__TimeZone: "Asia/Kolkata"
    ports:
      - "5080:8080"

  web:
    build:
      context: ./src/DayGrid.Web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  daygrid-db-data:
